name: Build and release

on:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -Force
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'6.0.0' -and $_.Version -le [version]'6.2.0' })) {
              Install-Module -Name Pester -MinimumVersion 6.0.0 -MaximumVersion 6.2.0 -Repository PSGallery -Scope CurrentUser -Force
          }
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.2.0 -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests'
          $configuration.Run.PassThru = $true
          $configuration.Should.DisableV5 = $true
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0) {
              throw "Pester reported $($result.FailedCount) failed test(s)."
          }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish package and create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tag '$version' must use the MAJOR.MINOR.PATCH format."
          }

          Import-Module Microsoft.PowerShell.PSResourceGet -Force

          $packagePath = Join-Path $env:RUNNER_TEMP 'package/PSTagLib'
          New-Item -Path $packagePath -ItemType Directory -Force | Out-Null
          Copy-Item -Path ./PSTagLib/* -Destination $packagePath -Recurse -Force
          Update-ModuleManifest -Path (Join-Path $packagePath 'PSTagLib.psd1') -ModuleVersion $version

          $repositoryName = 'GitHubPackages'
          $owner = $env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant()
          Register-PSResourceRepository -Name $repositoryName -Uri "https://nuget.pkg.github.com/$owner/index.json"
          Publish-PSResource -Path $packagePath -Repository $repositoryName -ApiKey $env:GH_TOKEN
          gh release create $version --generate-notes